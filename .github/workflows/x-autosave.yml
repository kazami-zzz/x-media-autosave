name: X Media AutoSave

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-media-autosave
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      users: ${{ steps.set-matrix.outputs.users }}
    steps:
      - name: Parse Usernames
        id: set-matrix
        env:
          X_USERNAMES: ${{ secrets.X_USERNAMES }}
        run: |
          JSON_ARRAY=$(echo -n "$X_USERNAMES" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          echo "users=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  save-media:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        username: ${{ fromJson(needs.prepare-matrix.outputs.users) }}

    steps:
      - name: Install gallery-dl and rclone
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade gallery-dl
          curl https://rclone.org/install.sh | sudo bash

      - name: Restore credentials
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          X_COOKIES_B64: ${{ secrets.X_COOKIES_B64 }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          mkdir -p state
          mkdir -p downloads

          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 -d > "$HOME/.config/rclone/rclone.conf"

          printf '%s' "$X_COOKIES_B64" \
            | base64 -d > cookies.txt

          chmod 600 "$HOME/.config/rclone/rclone.conf"
          chmod 600 cookies.txt

      - name: Restore download history
        env:
          X_USERNAME: ${{ matrix.username }}
        run: |
          rclone copyto \
            "gdrive:X_AutoSave/.state/${X_USERNAME}.sqlite3" \
            "state/archive.sqlite3" \
            || true

      - name: Check X and download new media
        env:
          X_USERNAME: ${{ matrix.username }}
          X_START_DATE: ${{ secrets.X_START_DATE }}
        run: |
          set +e

          mkdir -p "downloads/${X_USERNAME}"

          gallery-dl \
            --cookies cookies.txt \
            --download-archive state/archive.sqlite3 \
            --date-after "$X_START_DATE" \
            --abort 5 \
            --directory "downloads/${X_USERNAME}" \
            -o extractor.twitter.retweets=false \
            -o extractor.twitter.quoted=false \
            -o extractor.twitter.replies=false \
            -o extractor.twitter.videos=true \
            -o extractor.twitter.ratelimit=abort \
            "https://x.com/${X_USERNAME}/media"

          RESULT=$?
          echo "GALLERY_DL_RESULT=$RESULT" >> "$GITHUB_ENV"

          exit 0

      - name: Upload new media to Google Drive
        if: always()
        env:
          X_USERNAME: ${{ matrix.username }}
        run: |
          if [ -d "downloads/${X_USERNAME}" ]; then
            rclone copy \
              "downloads/${X_USERNAME}" \
              "gdrive:X_AutoSave/${X_USERNAME}"
          fi

      - name: Save download history
        if: always()
        env:
          X_USERNAME: ${{ matrix.username }}
        run: |
          if [ -f "state/archive.sqlite3" ]; then
            rclone copyto \
              "state/archive.sqlite3" \
              "gdrive:X_AutoSave/.state/${X_USERNAME}.sqlite3"
          fi

      - name: Report gallery-dl failure
        if: always()
        run: |
          exit "${GALLERY_DL_RESULT:-0}"
